# Publishes storybook-addon-colab to npm when a version tag (v*) is pushed.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored anywhere.
# The trusted publisher on npmjs.com is tied to this file name (release.yml), the
# repository winkerVSbecks/addon-colab and the environment "npm". Renaming any of
# them breaks publishing until the trusted publisher is recreated to match.
# See "Releasing" in README.md.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          # Versions below 1.0.0 and pre-releases (with a "-") go to "next"; others to "latest".
          major="${version%%.*}"
          if [ "$major" = "0" ] || [[ "$version" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          echo "Publishing $version under the dist-tag $dist_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in release builds: a poisoned cache could change what gets published.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the package contents
        env:
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish --dry-run --tag "$DIST_TAG"

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Require approval for each release in Settings → Environments → npm.
    # The same name must be entered as the environment in the npm trusted publisher.
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use npm 11.21.3
        run: |
          npm install --global npm@11.21.3
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish
        run: |
          published="$(npm view "storybook-addon-colab@$VERSION" version 2> /dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            echo "::notice::storybook-addon-colab@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public --tag "$DIST_TAG"
