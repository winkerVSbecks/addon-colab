<!doctype html><html><body style="margin:0">
<canvas id="c" content="drawable" style="display:block;width:900px;height:500px;background:#fafafa">
  <div id="wrap" drawable style="width:320px;height:200px;background:#fff;border:2px solid #36c">
    <iframe id="ifrA" src="inner.html" style="width:316px;height:196px;border:0;display:block"></iframe>
  </div>
  <iframe id="ifrB" drawable src="inner.html" style="width:320px;height:200px;border:2px solid #c63"></iframe>
</canvas>
<script>
  const c = document.getElementById('c'); const ctx = c.getContext('2d');
  const dpr = devicePixelRatio; c.width = 900 * dpr; c.height = 500 * dpr;
  window.geom = new URLSearchParams(location.search).get('geom') || 'auto';
  window.view = { panX: 40, panY: 30, zoom: 1 };
  window.paints = 0; window.paintErrors = [];
  window.place = { wrap: [10, 20], ifrB: [420, 20] };
  c.onpaint = (e) => {
    paints++;
    ctx.reset(); ctx.scale(dpr, dpr);
    ctx.translate(view.panX, view.panY); ctx.scale(view.zoom, view.zoom);
    for (const [id, [x, y]] of Object.entries(place)) {
      const el = document.getElementById(id);
      try {
        if (geom === 'auto') { ctx.drawElementImage(el, x, y); continue; }
        if (geom === 'sized') { ctx.drawElementImage(el, x, y, el.offsetWidth, el.offsetHeight); continue; }
        ctx.drawElementImage(el, x, y, { preserveElementGeometry: true });
        const css = new DOMMatrix().translate(view.panX, view.panY).scale(view.zoom).translate(x, y);
        const m = geom === 'grid' ? new DOMMatrix().scale(dpr).multiply(css) : css;
        c.updateElementGeometry(el, { canvasTransform: m });
      } catch (err) { paintErrors.push(id + ': ' + err); }
    }
  };
  window.setView = (v) => { Object.assign(view, v); c.requestPaint(); };
  window.ready = Promise.all([...document.querySelectorAll('iframe')].map((f) => new Promise((r) => f.contentDocument?.readyState === 'complete' ? r() : f.addEventListener('load', r))));
</script>
</body></html>
